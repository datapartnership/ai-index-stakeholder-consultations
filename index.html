<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #5c6578;
    --border: #d7dbe3;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --accent-soft: #e8eefc;
    --error: #c42b2b;
    --warn-bg: #fff6dd;
    --warn-border: #e8c460;
    --code-bg: #f0f2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b2029;
      --text: #e7eaf0;
      --muted: #9aa3b5;
      --border: #333a48;
      --accent: #6d95ff;
      --accent-text: #0d1120;
      --accent-soft: #232d45;
      --error: #ff7a7a;
      --warn-bg: #2e2814;
      --warn-border: #7a6420;
      --code-bg: #12151c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
  }
  h1 { margin: 0 0 8px; font-size: 1.6rem; line-height: 1.25; }
  .intro { margin: 0 0 24px; color: var(--muted); }
  .test-banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 20px;
    font-size: 0.92rem;
  }
  fieldset.q { border: 0; margin: 0 0 28px; padding: 0; min-width: 0; }
  fieldset.q[hidden] { display: none; }
  legend.q-label, label.q-label {
    display: block;
    font-weight: 600;
    margin-bottom: 10px;
    padding: 0;
  }
  .req { color: var(--error); margin-left: 2px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt input { margin: 0; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
  input[type=text], input[type=email], input[type=number], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, .opt:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .other-input { margin-top: 4px; }
  .other-input[hidden] { display: none; }
  .rating { display: flex; gap: 8px; flex-wrap: wrap; }
  .rating .opt { flex: 1 1 48px; justify-content: center; margin: 0; }
  .rating-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  .err { color: var(--error); font-size: 0.9rem; margin-top: 6px; }
  .err:empty { display: none; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  button {
    background: var(--accent);
    color: var(--accent-text);
    border: 0;
    border-radius: 8px;
    padding: 12px 22px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .form-error { color: var(--error); margin-top: 14px; }
  .form-error:empty { display: none; }
  .done h2 { margin: 0 0 8px; }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    font-size: 0.88rem;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card" id="app">
    <noscript>This survey needs JavaScript enabled.</noscript>
  </div>
</main>

<script src="questions.js"></script>
<script>
(function () {
  "use strict";

  const cfg = window.SURVEY_CONFIG;
  const app = document.getElementById("app");
  const OTHER = "__other__";

  if (!cfg || !Array.isArray(cfg.questions)) {
    app.textContent = "Survey configuration (questions.js) could not be loaded.";
    return;
  }

  const testMode = !cfg.flowUrl || /PASTE_YOUR_FLOW_URL_HERE/.test(cfg.flowUrl);
  document.title = cfg.title || "Survey";

  // ---------- helpers ----------
  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (attrs[k] === true) n.setAttribute(k, "");
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => c && n.appendChild(c));
    return n;
  }
  function labelText(q) {
    const frag = document.createDocumentFragment();
    frag.appendChild(document.createTextNode(q.label));
    if (q.required) frag.appendChild(el("span", { class: "req", "aria-hidden": "true", text: "*" }));
    return frag;
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === "x" ? r : (r & 3 | 8)).toString(16);
    });
  }

  // ---------- render ----------
  function renderQuestion(q) {
    const errId = "err_" + q.id;
    const isGroup = ["single", "multiple", "rating"].includes(q.type);
    const wrap = el(isGroup ? "fieldset" : "div", { class: "q", "data-qid": q.id });
    if (!isGroup) wrap.classList.add("q");

    if (isGroup) {
      const lg = el("legend", { class: "q-label" });
      lg.appendChild(labelText(q));
      wrap.appendChild(lg);
    } else {
      const lb = el("label", { class: "q-label", for: "q_" + q.id });
      lb.appendChild(labelText(q));
      wrap.appendChild(lb);
    }

    if (q.type === "single" || q.type === "multiple") {
      const inputType = q.type === "single" ? "radio" : "checkbox";
      const opts = (q.options || []).slice();
      opts.forEach(opt => {
        wrap.appendChild(el("label", { class: "opt" }, [
          el("input", { type: inputType, name: q.id, value: opt, "aria-describedby": errId }),
          el("span", { text: opt })
        ]));
      });
      if (q.allowOther) {
        wrap.appendChild(el("label", { class: "opt" }, [
          el("input", { type: inputType, name: q.id, value: OTHER, "aria-describedby": errId }),
          el("span", { text: q.otherLabel || "Other (please specify)" })
        ]));
        wrap.appendChild(el("input", {
          type: "text", class: "other-input", id: "q_" + q.id + "_other",
          "aria-label": "Please specify", placeholder: "Please specify", hidden: true, maxlength: 500
        }));
      }
    } else if (q.type === "rating") {
      const scale = q.scale || 5;
      const row = el("div", { class: "rating" });
      for (let i = 1; i <= scale; i++) {
        row.appendChild(el("label", { class: "opt" }, [
          el("input", { type: "radio", name: q.id, value: String(i), "aria-describedby": errId }),
          el("span", { text: String(i) })
        ]));
      }
      wrap.appendChild(row);
      if (q.minLabel || q.maxLabel) {
        wrap.appendChild(el("div", { class: "rating-labels" }, [
          el("span", { text: q.minLabel || "" }), el("span", { text: q.maxLabel || "" })
        ]));
      }
    } else if (q.type === "textarea") {
      wrap.appendChild(el("textarea", { id: "q_" + q.id, name: q.id, maxlength: q.maxLength || 4000, "aria-describedby": errId }));
    } else {
      const t = ["email", "number"].includes(q.type) ? q.type : "text";
      wrap.appendChild(el("input", {
        type: t, id: "q_" + q.id, name: q.id, "aria-describedby": errId,
        maxlength: t === "number" ? null : (q.maxLength || 500),
        min: q.min, max: q.max
      }));
    }

    wrap.appendChild(el("div", { class: "err", id: errId, "aria-live": "polite" }));
    return wrap;
  }

  function renderForm() {
    app.innerHTML = "";
    if (testMode) {
      app.appendChild(el("div", { class: "test-banner", role: "note", text:
        "Test mode: no flow URL is set in questions.js, so responses are not sent anywhere. " +
        "Submitting shows the data that would be sent." }));
    }
    app.appendChild(el("h1", { text: cfg.title || "Survey" }));
    if (cfg.intro) app.appendChild(el("p", { class: "intro", text: cfg.intro }));

    const form = el("form", { novalidate: true, id: "survey" });
    cfg.questions.forEach(q => form.appendChild(renderQuestion(q)));

    // Honeypot: invisible to people, often filled in by bots.
    form.appendChild(el("div", { class: "hp", "aria-hidden": "true" }, [
      el("label", { for: "hp_website", text: "Leave this field empty" }),
      el("input", { type: "text", id: "hp_website", name: "website", tabindex: "-1", autocomplete: "off" })
    ]));

    form.appendChild(el("button", { type: "submit", id: "submitBtn", text: cfg.submitLabel || "Submit" }));
    form.appendChild(el("div", { class: "form-error", id: "formError", role: "alert" }));

    form.addEventListener("input", onChange);
    form.addEventListener("change", onChange);
    form.addEventListener("submit", onSubmit);
    app.appendChild(form);
    updateDynamic();
  }

  // ---------- read answers ----------
  function readRaw(q) {
    const form = document.getElementById("survey");
    if (q.type === "single" || q.type === "rating") {
      const c = form.querySelector(`input[name="${q.id}"]:checked`);
      return c ? c.value : "";
    }
    if (q.type === "multiple") {
      return Array.from(form.querySelectorAll(`input[name="${q.id}"]:checked`)).map(i => i.value);
    }
    const f = document.getElementById("q_" + q.id);
    return f ? f.value.trim() : "";
  }
  function otherText(q) {
    const o = document.getElementById("q_" + q.id + "_other");
    return o ? o.value.trim() : "";
  }
  function isEmpty(v) { return Array.isArray(v) ? v.length === 0 : v === ""; }

  function conditionMet(q) {
    const s = q.showIf;
    if (!s) return true;
    const target = cfg.questions.find(x => x.id === s.question);
    if (!target || !isVisible(target)) return false;
    let v = readRaw(target);
    if (Array.isArray(v)) v = v.map(x => x === OTHER ? "Other" : x);
    else if (v === OTHER) v = "Other";
    if (s.answered) return !isEmpty(v);
    if ("equals" in s) return Array.isArray(v) ? v.includes(s.equals) : v === s.equals;
    if ("includes" in s) return Array.isArray(v) ? v.includes(s.includes) : v === s.includes;
    return true;
  }
  function isVisible(q) {
    const node = document.querySelector(`[data-qid="${q.id}"]`);
    return node ? !node.hidden : false;
  }

  function updateDynamic() {
    // Evaluate in order so chained conditions resolve correctly.
    cfg.questions.forEach(q => {
      const node = document.querySelector(`[data-qid="${q.id}"]`);
      node.hidden = !conditionMet(q);
      const other = document.getElementById("q_" + q.id + "_other");
      if (other) {
        const raw = readRaw(q);
        const on = Array.isArray(raw) ? raw.includes(OTHER) : raw === OTHER;
        other.hidden = !on;
      }
    });
  }

  function onChange(e) {
    updateDynamic();
    const qnode = e.target.closest("[data-qid]");
    if (qnode) document.getElementById("err_" + qnode.dataset.qid).textContent = "";
    if (e.type === "change" && e.target.type === "radio" && e.target.value === OTHER) {
      const o = document.getElementById("q_" + e.target.name + "_other");
      if (o) o.focus();
    }
  }

  // ---------- validate & build payload ----------
  function validate() {
    let first = null;
    cfg.questions.forEach(q => {
      const errEl = document.getElementById("err_" + q.id);
      errEl.textContent = "";
      if (!isVisible(q)) return;
      const raw = readRaw(q);
      let msg = "";
      if (q.required && isEmpty(raw)) msg = "Please answer this question.";
      const otherOn = Array.isArray(raw) ? raw.includes(OTHER) : raw === OTHER;
      if (!msg && otherOn && !otherText(q)) msg = "Please specify your answer.";
      if (!msg && q.type === "email" && raw && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) msg = "Please enter a valid email address.";
      if (msg) {
        errEl.textContent = msg;
        if (!first) first = document.querySelector(`[data-qid="${q.id}"] input, [data-qid="${q.id}"] textarea`);
      }
    });
    if (first) first.focus();
    return !first;
  }

  function buildPayload() {
    // Flat object: one key per column, always present, so Excel mapping never breaks.
    const p = { responseId: uuid(), submittedAt: new Date().toISOString() };
    cfg.questions.forEach(q => {
      const visible = isVisible(q);
      let raw = visible ? readRaw(q) : (q.type === "multiple" ? [] : "");
      if (Array.isArray(raw)) {
        p[q.id] = raw.map(v => v === OTHER ? "Other" : v).join("; ");
      } else {
        p[q.id] = raw === OTHER ? "Other" : raw;
      }
      if (q.allowOther) {
        const on = Array.isArray(raw) ? raw.includes(OTHER) : raw === OTHER;
        p[q.id + "_other"] = visible && on ? otherText(q) : "";
      }
    });
    return p;
  }

  // ---------- submit ----------
  async function onSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const formErr = document.getElementById("formError");
    formErr.textContent = "";

    if (document.getElementById("hp_website").value) { showThanks(); return; } // likely a bot
    if (!validate()) return;

    const payload = buildPayload();

    if (testMode) { showTestResult(payload); return; }

    btn.disabled = true;
    btn.textContent = "Sending…";
    try {
      const res = await fetch(cfg.flowUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" }, // simple request: avoids a CORS preflight
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      showThanks();
    } catch (err) {
      formErr.textContent = "Sorry, your response could not be sent. Please check your connection and try again.";
      btn.disabled = false;
      btn.textContent = cfg.submitLabel || "Submit";
      console.error("Survey submission failed:", err);
    }
  }

  function showThanks() {
    app.innerHTML = "";
    app.appendChild(el("div", { class: "done", role: "status" }, [
      el("h2", { text: cfg.thankYouTitle || "Thank you!" }),
      el("p", { class: "muted", text: cfg.thankYouMessage || "Your response has been recorded." })
    ]));
  }

  function showTestResult(payload) {
    const json = JSON.stringify(payload, null, 2);
    app.innerHTML = "";
    const copyBtn = el("button", { type: "button", text: "Copy JSON" });
    const backBtn = el("button", { type: "button", class: "secondary", text: "Back to survey" });
    copyBtn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(json); copyBtn.textContent = "Copied"; }
      catch { copyBtn.textContent = "Select and copy manually"; }
    });
    backBtn.addEventListener("click", renderForm);
    app.appendChild(el("div", { class: "done" }, [
      el("h2", { text: "Test mode: this is what would be sent" }),
      el("p", { class: "muted", text:
        "Paste this into Parse JSON's “Use sample payload to generate schema” in your flow. " +
        "Each key is a column for your Excel table." }),
      el("pre", { text: json }),
      el("div", { class: "actions" }, [copyBtn, backBtn])
    ]));
  }

  renderForm();
})();
</script>
</body>
</html>
